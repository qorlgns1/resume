# 기본 구성. 로컬에서는 그대로 쓰고, 운영에서는 docker-compose.override.yml로 주소와 프록시 네트워크를 덧붙인다 (README "운영 배포").
#   cp .env.example .env   # AUTH_SECRET 채우기
#   docker compose up --build
#   docker compose exec -it admin node cli.mjs create   # 관리자 계정 만들기
# 공개 사이트: http://localhost:3000   어드민: http://localhost:3001
# 포트가 겹치면 WEB_PORT / ADMIN_PORT로 바꾼다: WEB_PORT=3200 ADMIN_PORT=3201 docker compose up --build

services:
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      # 세션 서명 키. 저장소 루트 .env에 둔다 (커밋 금지).
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET을 .env에 설정하세요. 만들기 - openssl rand -base64 32}
      # 브라우저가 접속하는 어드민 주소 (로그인 요청의 출처 검사에 사용)
      ADMIN_URL: http://localhost:${ADMIN_PORT:-3001}
      # 브라우저가 여는 공개 사이트 주소 (컨테이너 이름이 아니라 호스트 주소)
      PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
    volumes:
      # SQLite DB(/data/resume.db)와 업로드 파일. 백업은 이 볼륨을 복사한다.
      - admin-data:/data
    ports:
      # 호스트 포트는 이 컴퓨터에서만 연다. 외부 공개는 리버스 프록시 네트워크를 통해서만 한다.
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      CONTENT_SOURCE: ${CONTENT_SOURCE:-api}
      # 브라우저가 여는 공개 사이트 주소. sitemap·공유 미리보기의 절대 주소에 쓴다.
      SITE_URL: ${SITE_URL:-http://localhost:${WEB_PORT:-3000}}
      # web 서버가 컨테이너 네트워크 안에서 호출하는 주소 (브라우저용 주소가 아님)
      CONTENT_API_URL: http://admin:3001
      # 방문 분석 (선택). POSTHOG_KEY가 비어 있으면 꺼진다.
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      admin:
        condition: service_healthy

volumes:
  admin-data:
